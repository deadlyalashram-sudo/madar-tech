<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة الطلب | عبدالله التقنية</title><link rel="stylesheet" href="styles.css?v=9"><link rel="stylesheet" href="enhancements.css?v=9"></head>
<body class="portal-body"><main class="portal-shell narrow"><header class="portal-header"><div class="brand"><span>ع</span><strong>مركز خدمة عبدالله</strong></div><a href="/">الرئيسية</a></header><section class="portal-login"><p class="eyebrow">متابعة الطلب</p><h1>اعرف حالة طلبك</h1><p>أدخل رقم الطلب وآخر أربعة أرقام من جوالك.</p><form id="trackingForm"><label>رقم الطلب<input name="ticket" required placeholder="MT-2608-AB12" dir="ltr"></label><label>آخر 4 أرقام من الجوال<input name="phone" required inputmode="numeric" maxlength="4" pattern="\d{4}" dir="ltr"></label><button class="primary" type="submit">عرض الحالة</button><p id="trackingStatus" role="status"></p></form><div id="trackingResult"></div></section></main><script src="tracking.js?v=9"></script></body></html>
