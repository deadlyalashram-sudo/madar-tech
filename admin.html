<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مركز خدمة مدار | لوحة الإدارة</title>
  <link rel="stylesheet" href="styles.css?v=9"><link rel="stylesheet" href="enhancements.css?v=11">
</head>
<body class="portal-body">
  <main class="portal-shell">
    <header class="portal-header"><div class="brand"><span>م</span><strong>مركز خدمة مدار</strong></div><a href="/">الموقع العام</a></header>
    <section class="portal-login" id="loginPanel">
      <p class="eyebrow">دخول محمي</p><h1>لوحة إدارة الطلبات</h1><p>هذه الصفحة مخصصة لإدارة طلبات العملاء.</p>
      <form id="loginForm"><label>كلمة مرور المدير<input id="adminPassword" type="password" name="password" required autocomplete="current-password"></label><button id="loginButton" class="primary" type="submit">تسجيل الدخول</button><p id="loginStatus" role="status" aria-live="polite"></p></form>
    </section>
    <section class="admin-workspace" id="adminWorkspace" hidden>
      <div class="admin-toolbar"><div><p class="eyebrow">العمليات</p><h1>طلبات الخدمة</h1></div><div class="toolbar-actions"><input id="requestSearch" type="search" placeholder="ابحث بالاسم أو الجوال أو رقم الطلب" aria-label="البحث في الطلبات"><select id="statusFilter"><option value="">كل الحالات</option><option value="new">جديد</option><option value="contacted">تم التواصل</option><option value="scheduled">مجدول</option><option value="in_progress">جاري العمل</option><option value="completed">مكتمل</option><option value="cancelled">ملغي</option></select><button id="exportRequests">تصدير CSV</button><button id="refreshRequests">تحديث</button><button id="logoutButton">خروج</button></div></div>
      <div class="admin-metrics" id="adminMetrics"></div><div class="request-list" id="requestList"></div>
    </section>
  </main>
  <script src="admin.js?v=11"></script>
</body></html>
